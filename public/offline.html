<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网络已断开 · 离线阅读 - AstroLib</title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <style>
    :root {
      --bg: #fdfcff;
      --text: #1a1c1e;
      --text-muted: #74777f;
      --surface: #f3f3fa;
      --primary: #005ac1;
      --on-primary: #ffffff;
      --outline: #c4c6d0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111318;
        --text: #e2e2e9;
        --text-muted: #8e9099;
        --surface: #1e2025;
        --primary: #a8c8ff;
        --on-primary: #003062;
        --outline: #44474f;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      text-align: center;
    }
    .offline-card {
      max-width: 480px;
      width: 100%;
      background: var(--surface);
      border-radius: 28px;
      padding: 2.5rem 2rem;
      border: 1px solid var(--outline);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
    }
    .offline-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 1.5rem;
      border-radius: 50%;
      background: rgba(168, 200, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
    }
    .offline-icon svg { width: 32px; height: 32px; fill: currentColor; }
    h1 { font-size: 1.375rem; font-weight: 600; margin-bottom: 0.75rem; }
    p { font-size: 0.9375rem; line-height: 1.6; color: var(--text-muted); margin-bottom: 2rem; }
    .actions { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 40px;
      padding: 0 1.5rem;
      border-radius: 20px;
      font-size: 0.875rem;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      border: none;
    }
    .btn-primary { background: var(--primary); color: var(--on-primary); }
    .btn-outline { background: transparent; color: var(--primary); border: 1px solid var(--outline); }
    .tip { margin-top: 1.5rem; font-size: 0.8125rem; color: var(--text-muted); opacity: 0.8; }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M23.64 7c-.45-.34-4.93-3.95-11.64-3.95-3.08 0-5.83.77-8.08 1.94l1.45 1.45C6.91 5.76 9.27 5.05 12 5.05c5.35 0 9.07 2.85 9.4 3.11L12 19.98 9.64 17.03l1.41-1.41L12 16.74l6.73-8.39c-.31-.24-3.56-2.5-8.73-2.5-2.09 0-3.95.42-5.54 1.15l-2.12-2.12c2.25-1.12 5.05-1.88 7.66-1.88 6.71 0 11.19 3.61 11.64 3.95l1.98-2.45L23.64 7zM1.41 1.69L0 3.1l2.42 2.42C1.48 6.25.68 7.02.36 7.35L12 21.85l4.37-5.46 4.88 4.88 1.41-1.41L1.41 1.69z"/>
      </svg>
    </div>
    <h1>当前处于离线模式</h1>
    <p>未能连接到网络，且当前请求的章节尚未在本地建立缓存。<br>您已访问过的教材章节与题目仍可在本地离线阅读。</p>
    <div class="actions">
      <button class="btn btn-primary" onclick="window.location.reload()">刷新重试</button>
      <a href="/" class="btn btn-outline">返回首页</a>
    </div>
    <div class="tip">提示：再次联网并浏览章节后，内容将自动持久化至本地以便离线使用。</div>
  </div>
</body>
</html>
