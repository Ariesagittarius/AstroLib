<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>AstroLib 徽标与 Favicon 实际效果预览</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    body {
      font-family: 'Google Sans', 'Plus Jakarta Sans', system-ui, sans-serif;
      background: #f0f4f9;
      color: #1f1f1f;
      padding: 2rem;
      margin: 0;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
    }
    .header-bar {
      margin-bottom: 2rem;
    }
    .header-bar h1 {
      margin: 0 0 0.5rem 0;
      font-size: 1.8rem;
    }
    .header-bar p {
      margin: 0;
      color: #444746;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      border: 1px solid #e0e4eb;
    }
    .card.dark {
      background: #1e1f20;
      color: #e3e3e3;
      border-color: #333538;
    }
    .card h3 {
      margin-top: 0;
      margin-bottom: 1.25rem;
      font-size: 1.1rem;
    }
    .preview-box {
      width: 100%;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      margin-bottom: 1.25rem;
    }
    .card.light .preview-box {
      background: #ffffff;
    }
    .card.dark .preview-box {
      background: #1e1f20;
    }
    .preview-box img {
      max-width: 260px;
      max-height: 200px;
      object-fit: contain;
    }
    .navbar-mockup {
      width: 90%;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.6rem 1.2rem;
      border-radius: 9999px;
      margin-top: auto;
    }
    .card.light .navbar-mockup {
      background: #f8fafd;
      border: 1px solid #dde3ea;
    }
    .card.dark .navbar-mockup {
      background: #2b2c2d;
      border: 1px solid #444746;
    }
    .navbar-mockup img {
      width: 28px;
      height: 23px;
      object-fit: contain;
    }
    .brand-name {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.015em;
    }
    .tab-mockup-section {
      background: #ffffff;
      border-radius: 20px;
      padding: 1.5rem;
      border: 1px solid #e0e4eb;
      margin-top: 2rem;
    }
    .tab-mockup-container {
      display: flex;
      gap: 1rem;
      margin-top: 1rem;
    }
    .tab-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      border-radius: 8px 8px 0 0;
      font-size: 0.9rem;
      border: 1px solid #dde3ea;
      border-bottom: none;
      background: #f8fafd;
      width: 240px;
    }
    .tab-item.dark-tab {
      background: #292a2d;
      color: #e8eaed;
      border-color: #3c4043;
    }
    .tab-item img {
      width: 16px;
      height: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-bar">
      <h1>AstroLib 徽标与 Favicon 真实渲染效果</h1>
      <p>完全扣除背景，保留高保真原生光影与微过渡（非矢量 SVG 伪造，完美对齐 Google 官方设计与双模式背景）。</p>
    </div>

    <div class="grid">
      <!-- 浅色模式 -->
      <div class="card light">
        <h3>浅色背景表现 (Light Surface)</h3>
        <div class="preview-box">
          <img src="/astrolib-logo.png" alt="AstroLib 徽标 (浅色)" />
        </div>
        <div class="navbar-mockup">
          <img src="/astrolib-logo.png" alt="AstroLib 导航栏徽标" />
          <span class="brand-name">AstroLib</span>
        </div>
      </div>

      <!-- 深色模式 -->
      <div class="card dark">
        <h3>深色背景表现 (Dark Surface / #1e1f20)</h3>
        <div class="preview-box">
          <img src="/astrolib-logo.png" alt="AstroLib 徽标 (深色)" />
        </div>
        <div class="navbar-mockup">
          <img src="/astrolib-logo.png" alt="AstroLib 导航栏徽标" />
          <span class="brand-name">AstroLib</span>
        </div>
      </div>
    </div>

    <div class="tab-mockup-section">
      <h3>浏览器标签页徽标 (Favicon 预览)</h3>
      <div class="tab-mockup-container">
        <div class="tab-item">
          <img src="/favicon-32x32.png" alt="Favicon" />
          <span>AstroLib · 数学与物理教材</span>
        </div>
        <div class="tab-item dark-tab">
          <img src="/favicon-32x32.png" alt="Favicon" />
          <span>AstroLib · 计算机与工程分析</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
