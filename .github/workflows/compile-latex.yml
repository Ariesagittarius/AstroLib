name: Compile LaTeX Document

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Unique Compilation Job ID'
        required: true
        type: string
      blob_sha:
        description: 'GitHub Git Blob SHA (for files up to 100MB)'
        required: false
        default: ''
        type: string
      tex_gz_b64:
        description: 'Gzip + Base64 Encoded LaTeX Source Code'
        required: false
        default: ''
        type: string
      tex_b64:
        description: 'Base64 Encoded LaTeX Source Code (legacy fallback)'
        required: false
        default: ''
        type: string
      output_filename:
        description: 'Target PDF Filename'
        required: false
        default: 'exercise.pdf'
        type: string

permissions:
  contents: write

concurrency:
  group: latex-job-${{ github.event.inputs.job_id }}
  cancel-in-progress: false

jobs:
  compile:
    name: XeLaTeX Build (${{ github.event.inputs.job_id }})
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare LaTeX Workspace
        id: prep
        run: |
          mkdir -p workspace
          if [ -n "${{ github.event.inputs.blob_sha }}" ]; then
            echo "Fetching LaTeX source from Git Blob SHA: ${{ github.event.inputs.blob_sha }}..."
            curl -sSL \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/${{ github.repository }}/git/blobs/${{ github.event.inputs.blob_sha }}" \
              > workspace/main.tex
          elif [ -n "${{ github.event.inputs.tex_gz_b64 }}" ]; then
            echo "Extracting Gzip-compressed LaTeX source..."
            echo "${{ github.event.inputs.tex_gz_b64 }}" | base64 -d | gzip -d > workspace/main.tex
          elif [ -n "${{ github.event.inputs.tex_b64 }}" ]; then
            echo "Decoding raw Base64 LaTeX source (legacy mode)..."
            echo "${{ github.event.inputs.tex_b64 }}" | base64 -d > workspace/main.tex
          else
            echo "::error::No LaTeX source provided (missing blob_sha, tex_gz_b64, or tex_b64)"
            exit 1
          fi

          if [ ! -s workspace/main.tex ]; then
            echo "::error::workspace/main.tex is empty or failed to generate!"
            exit 1
          fi

          echo "Workspace initialized with main.tex (size: $(wc -c < workspace/main.tex) bytes)"

      - name: Compile Document with XeLaTeX
        id: compile
        continue-on-error: true
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: workspace
          compiler: latexmk
          latexmk_use_xelatex: true
          texlive_version: 2024
          args: -file-line-error -interaction=nonstopmode -f

      - name: Prepare Output Asset
        if: always() && hashFiles('workspace/main.pdf') != ''
        id: output
        run: |
          OUT_NAME="${{ github.event.inputs.output_filename }}"
          if [ -z "$OUT_NAME" ]; then
            OUT_NAME="exercise-${{ github.event.inputs.job_id }}.pdf"
          fi
          cp workspace/main.pdf "workspace/${OUT_NAME}"
          echo "pdf_path=workspace/${OUT_NAME}" >> $GITHUB_OUTPUT
          echo "filename=${OUT_NAME}" >> $GITHUB_OUTPUT

      - name: Publish PDF to GitHub Release Asset
        if: always() && steps.output.outputs.pdf_path != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: job-${{ github.event.inputs.job_id }}
          name: "LaTeX Build ${{ github.event.inputs.job_id }}"
          body: |
            ## Automated XeLaTeX Compilation Result
            - **Job ID**: `${{ github.event.inputs.job_id }}`
            - **Filename**: `${{ steps.output.outputs.filename }}`
            - **Engine**: XeLaTeX / TeX Live 2024 (ctex / Jinwen-XU/homework)
            - **Generated**: ${{ github.event.repository.updated_at }}
          files: ${{ steps.output.outputs.pdf_path }}
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture Failure Log
        if: always() && hashFiles('workspace/main.pdf') == ''
        run: |
          if [ -f workspace/main.log ]; then
            tail -n 150 workspace/main.log > workspace/build-error.log
          else
            echo "LaTeX compilation terminated before generating log." > workspace/build-error.log
          fi

      - name: Publish Failure Log to Release
        if: always() && hashFiles('workspace/main.pdf') == ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: job-${{ github.event.inputs.job_id }}
          name: "LaTeX Build FAILED ${{ github.event.inputs.job_id }}"
          body: "LaTeX compilation failed. See attached build-error.log for compiler output."
          files: workspace/build-error.log
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload PDF Artifact (Fallback)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-${{ github.event.inputs.job_id }}
          path: workspace/*.pdf
          if-no-files-found: ignore
          retention-days: 1

      - name: Verify Final PDF Status
        if: always()
        run: |
          if [ ! -f workspace/main.pdf ]; then
            echo "::error::XeLaTeX compilation halted before generating PDF. See build-error.log for compiler details."
            exit 1
          fi
          echo "XeLaTeX compilation completed and verified: $(ls -lh workspace/*.pdf)"
